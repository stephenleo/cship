[package]
name          = "cship"
version       = "1.8.1"
edition       = "2024"
description   = "A beautiful, fully customizable statusline for Claude Code — Starship-style TOML config, themeable colours, Nerd Font glyphs, and tunable cost/context/usage thresholds"
license       = "Apache-2.0"
repository    = "https://github.com/stephenleo/cship"
homepage      = "https://cship.dev"
documentation = "https://cship.dev"
keywords      = ["starship", "claude", "statusline", "terminal"]
categories    = ["command-line-utilities"]
readme        = "README.md"
exclude       = [".github/"]

[dependencies]
clap               = { version = "4.5", features = ["derive"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
toml               = "1"
ureq               = { version = "3", features = ["json"] }
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nu-ansi-term       = "0.50"
chrono             = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width      = "0.2"
schemars           = "1"

# Terminal-width detection for `$fill` right-alignment. Unix only: the statusline
# child has no tty of its own, so we walk up to an ancestor's controlling tty and
# read its window size. Windows has no equivalent and falls back to config/80.
# Kept deliberately lean (`libc` + `std`, no build-time toolchain deps) — see
# `src/terminal.rs`.
[target.'cfg(unix)'.dependencies]
libc          = "0.2"
terminal_size = "0.4"

[dev-dependencies]
rstest     = "0.26"
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
filetime   = "0.2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
